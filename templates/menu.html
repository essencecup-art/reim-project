{% extends 'base.html' %}

{% block title %}Our Menu | LuxeEats{% endblock %}

{% block content %}
<div class="absolute top-20 right-6 z-40">
    <a href="{{ url_for('cart.show_cart') }}" class="px-4 py-2 bg-stone-900 border border-stone-800 hover:border-amber-500/30 rounded-lg text-xs font-mono uppercase tracking-wider text-amber-500 flex items-center gap-2 transition-all duration-300 shadow-md">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
        </svg>
        View Order
    </a>
</div>

<div class="space-y-8">
    <div class="grid md:grid-cols-2 gap-6">
        {% for item in menu_items %}
        <div class="p-6 bg-stone-950 border border-stone-800 rounded-xl flex flex-col justify-between transition hover:border-amber-500/50 group">
            <div class="flex justify-between items-start gap-4">
                <div>
                    <span class="text-[10px] uppercase tracking-widest font-mono text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded-full">{{ item.category }}</span>
                    <h3 class="text-lg font-bold text-stone-100 group-hover:text-amber-400 transition mt-2">{{ item.name }}</h3>
                    <p class="text-sm text-stone-400 mt-1 pr-4">{{ item.description }}</p>
                </div>
                <span class="text-xl font-mono font-bold text-stone-200">${{ "%.2f"|format(item.price / 100) }}</span>
            </div>
            
            <div class="mt-6 pt-4 border-t border-stone-900 flex justify-end relative">
                <button 
                    onclick="addToCart('{{ item.id }}', this)"
                    class="relative px-4 py-2 bg-stone-900 border border-stone-800 rounded-lg text-xs font-semibold uppercase tracking-wider text-stone-300 hover:bg-stone-800 hover:text-amber-400 transition-all duration-300 cursor-pointer overflow-visible">
                    Add to Order
                </button>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script>
function addToCart(itemId, buttonElement) {
    fetch(`/cart/add/${itemId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
    })
    .then(response => response.json())
    .then(data => {
        if(data.success) {
            // ─── CREATE A FLOATING +1 BUBBLE ───────────────────────
            const badge = document.createElement('span');
            badge.innerText = '+1';
            
            // Tailwind classes to style it as an absolute-positioned floating element
            badge.className = "absolute -top-3 -right-2 text-xs font-mono font-bold text-amber-500 transition-all duration-500 ease-out transform translate-y-1 opacity-0 pointer-events-none";
            // Append the badge right into the button's parent container
            buttonElement.appendChild(badge);
            
            // Trigger the animation frame (Fly up and fade in)
            requestAnimationFrame(() => {
                badge.classList.remove('translate-y-1', 'opacity-0'); // ◄── Fixed: remove translate-y-1
                badge.classList.add('-translate-y-4', 'opacity-100');
            });
            
            // After half a second, fade it out and erase it from the browser memory
            setTimeout(() => {
                badge.classList.remove('opacity-100');
                badge.classList.add('opacity-0');
                setTimeout(() => badge.remove(), 500);
            }, 600);
            
            // ─── SMOOTH BUTTON FLASH FEEDBACK ──────────────────────
            buttonElement.classList.remove('border-stone-800', 'text-stone-300');
            buttonElement.classList.add('border-amber-500/50', 'text-amber-400');
            
            setTimeout(() => {
                buttonElement.classList.remove('border-amber-500/50', 'text-amber-400');
                buttonElement.classList.add('border-stone-800', 'text-stone-300');
            }, 800);
        }
    })
    .catch(error => console.error('Error adding item:', error));
}
</script>
{% endblock %}
