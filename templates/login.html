{% extends 'base.html' %}

{% block title %}Sign In | LuxeEats{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="w-full max-w-md p-8 bg-stone-900 border border-stone-800 rounded-2xl shadow-xl space-y-8 text-center">
        
        <div class="space-y-2">
            <h1 class="text-2xl font-extrabold tracking-tight text-stone-100 font-mono uppercase text-amber-500">LuxeEats</h1>
            <h2 class="text-xl font-bold text-stone-200">Welcome back to your table</h2>
            <p class="text-xs text-stone-400">Secure verification via your enterprise account.</p>
        </div>

        <hr class="border-stone-800" />

        <div class="flex justify-center py-4">
            <!-- 🚀 Clean, unmanaged link that triggers your Python redirect flawlessly -->
            <a href="{{ url_for('auth.login') }}" 
            class="px-6 py-3 bg-stone-950 border border-stone-800 rounded-full text-xs font-mono font-bold uppercase tracking-widest text-stone-300 hover:bg-stone-900 hover:text-amber-400 hover:border-amber-500/30 transition-all duration-300 flex items-center gap-3 shadow-lg">
                <!-- Minimalist Google Icon -->
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                </svg>
                <span>Continue with Google</span>
            </a>
        </div>

        <hr class="border-stone-800" />
        
        <p class="text-[10px] font-mono text-stone-500 tracking-wider uppercase">
            Protected by Google Identity Services
        </p>
    </div>
</div>
{% endblock %}
